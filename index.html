<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="shortcut icon" href="icons8-chrome-50.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="media.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
  <div class="webpage">
    <header>
      <nav>
        <div class="left-nav">
          <li><a class="hover" href="#">About</a></li>
          <li><a class="hover" href="#">Store</a></li>
        </div>
        <div class="right-nav">
          <li><a class="hover" href="#">Gmail</a></li>
          <li><a class="hover" href="#">Images</a></li>
          <li><img class="icon" src="icon.svg" title="Google Apps" /></li>
          <li>
            <img src="/pfp.jpg" title="Google Account" width="38px" class="pfp" />
          </li>
        </div>
      </nav>
    </header>

    <main>
      <!-- <img src="https://www.google.com/logos/doodles/2026/world-cup-2026-finals-6753651837111357-la22242a.gif"
        alt="google_logo" /> -->
      <!-- Changing-->
      <!-- <img src="https://www.google.com/logos/doodles/2026/world-cup-2026-a-celebration-6753651837111349.2-la22242a.gif"
        alt="google_logo" /> -->
      <!-- FiFA-->
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/1920px-Google_2015_logo.svg.png?_=20160213081640"
        alt="google_logo" /> 
      <!-- Default-->
    </main>

    <section>
      <div class="search-box">
        <div class="add-icon hover" title="Enhance your search with tabs, files or an AI tool">
          <i class="ri-add-line"></i>
        </div>

        <div class="text-box">
          <textarea name="" onkeydown="if(event.key === 'Enter') event.preventDefault();"></textarea>
        </div>

        <div class="mic-icon hover" title="Search by voice">
          <i class="ri-mic-fill"></i>
        </div>

        <div class="lens-icon hover" title="Search by image">
          <img src="google-lens.png" class="lens" width="20px" />
        </div>

        <div class="ai-box hover" title="Ask AI Mode in Google Search">
          <img src="ai-search.png" width="20px" />
          <p>AI Mode</p>
        </div>
      </div>
    </section>

    <div class="shortcut">
      <div class="shbox" title="Add shortcut">
        <div class="plus-icon">
          <i class="ri-add-line"></i>
        </div>
        <p class="text">Add shortcut</p>
      </div>
    </div>

    <div class="languages">
      <div class="lang">
        <p>Google offered in:</p>
        <a class="hover" href="#">हिन्दी</a>
        <a class="hover" href="#">বাংলা</a>
        <a class="hover" href="#">తెలుగు</a>
        <a class="hover" href="#">मराठी</a>
        <a class="hover" href="#">தமிழ்</a>
        <a class="hover" href="#">ગુજરાતી</a>
        <a class="hover" href="#">ಕನ್ನಡ</a>
        <a class="hover" href="#">മലയാളം</a>
        <a class="hover" href="#">ਪੰਜਾਬੀ</a>
      </div>
    </div>

    <footer>
      <div class="f-top">
        <div class="para">
          <p>India</p>
        </div>
      </div>
      <!-- <hr> -->
      <div class="f-bottom">
        <div class="inside-f-bottom">
          <div class="l">
            <a class="hover" href="#">Advertising</a>
            <a class="hover" href="#">Business</a>
            <a class="hover" href="#">How Search works</a>
          </div>
          <div class="r">
            <a class="hover" href="#">Privacy</a>
            <a class="hover" href="#">Terms</a>
            <a class="hover" href="#">Setting</a>
          </div>
        </div>
      </div>
    </footer>
  </div>


  <script src="script.js"></script>
</body>

</html>
